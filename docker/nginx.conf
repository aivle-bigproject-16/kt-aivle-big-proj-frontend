# frontend 컨테이너용 nginx 설정. 이 파일이 정본이다.
# 배선은 인프라가 정하지만, Docker 빌드 컨텍스트 밖의 파일은 COPY 할 수 없으므로
# 파일 자체는 화면 레포가 가진다. 인프라 레포에 사본을 두지 않는다. 두면 갈라진다.
#
# nginx 역할 3가지:
#   1) 정적 번들 서빙 (Vite build 산출물)
#   2) /api → backend:8080 리버스 프록시
#   3) /ws  → backend:8080 WebSocket 업그레이드 프록시

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1) SPA. 클라이언트 라우팅 폴백이다. SSR 은 없다(내부 대시보드라 SEO 가 필요 없다).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2) REST
    #    proxy_pass 끝의 슬래시가 /api 접두사를 벗긴다. /api/dashboard → backend:8080/dashboard
    #    슬래시를 빼면 접두사가 그대로 전달되어(/api/dashboard) 개발 환경과 어긋난다.
    #    개발 환경 vite proxy 도 /api 를 벗기므로 이쪽이 정합이다.
    #
    #    전제: 백엔드 컨트롤러는 /api 없는 경로로 매핑한다(서블릿 접두사 미사용).
    #    현재 ReportController 만 /api/reports 로 매핑돼 있어 이 전제를 깬다.
    #    그대로 두면 리포트 경로만 404 가 난다. 백엔드에서 /reports 로 고쳐야 한다.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) WebSocket. 시뮬레이션 실시간 채널이다(순수 WebSocket. STOMP·SockJS 아님).
    #    엔드포인트 /ws/sim · 페이로드는 배치 단위 전체 스냅샷이다.
    #
    #    함정: 화면이 /api/ws/sim 으로 접속하면 이 블록이 아니라 위의 location /api/ 에 걸린다.
    #          Upgrade 헤더 없이 프록시되어 핸드셰이크가 실패한다.
    #          socketClient 는 REST 기본 경로를 WebSocket 주소에 붙이면 안 된다.
    #    인증: 브라우저 WebSocket 은 커스텀 헤더를 못 붙인다. 토큰은 쿠키로 간다.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;    # 유휴 연결이 끊기지 않도록 길게 잡는다
        proxy_send_timeout 3600s;
    }
}
