# frontend 컨테이너용 nginx 설정. 이 파일이 정본이다.
# 배선은 인프라가 정하지만, Docker 빌드 컨텍스트 밖의 파일은 COPY 할 수 없으므로
# 파일 자체는 화면 레포가 가진다. 인프라 레포에 사본을 두지 않는다. 두면 갈라진다.
#
# nginx 역할 4가지:
#   1) 정적 번들 서빙 (Vite build 산출물. SPA 폴백)
#   2) /api      → backend:8080   접두사를 벗겨서 전달
#   3) /ws       → backend:8080   접두사 유지. WebSocket 업그레이드
#   4) /ai/logs  → ai-infer:8000  접두사를 벗겨서 전달. SSE 로그 스트림
#
# 접두사를 벗기는 규칙이 경로마다 다르다. 기준은 vite.config.ts 의 dev 프록시다.
# 개발과 배포가 다르게 동작하면 로컬에서 통과한 화면이 배포에서 깨진다.

# 도커 내장 DNS. ai-infer 를 요청 시점에 해석하기 위해 필요하다. 아래 4) 참조.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTPS 종단 프록시(Caddy)가 전달한 원래 스킴을 보존한다.
# 로컬에서 nginx 로 직접 접속할 때는 기존처럼 현재 요청 스킴을 사용한다.
map $http_x_forwarded_proto $websocket_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 검사 이미지 업로드가 있다. 기본값 1m 이면 큰 이미지가 413 으로 막힌다.
    client_max_body_size 64m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 1) SPA. 클라이언트 라우팅 폴백이다. SSR 은 없다(내부 대시보드라 SEO 가 필요 없다).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 자산은 내용이 바뀌면 파일명이 바뀐다. 길게 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않는다. 캐시되면 새로 배포한 번들이 반영되지 않는다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 2) REST
    #    proxy_pass 끝의 슬래시가 /api 접두사를 벗긴다. /api/dashboard → backend:8080/dashboard
    #    슬래시를 빼면 접두사가 그대로 전달되어(/api/dashboard) 개발 환경과 어긋난다.
    #    개발 환경 vite proxy 도 /api 를 벗기므로 이쪽이 정합이다.
    #
    #    전제: 백엔드 컨트롤러는 /api 없는 경로로 매핑한다(서블릿 접두사 미사용).
    #    2026-08-12 확인 결과 전제를 깨는 컨트롤러가 아직 하나 남아 있다.
    #      AuthController        /auth        OK
    #      BatteryCellController /battery     OK
    #      DashboardController   /dashboard   OK
    #      NoticeController      /notices     OK
    #      SimulationController  /sim         OK
    #      ReportController      /api/reports/daily   ← 어긋난다
    #    그대로 두면 일간 리포트 경로만 404 가 난다. 백엔드에서 /reports/daily 로 고쳐야 한다.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드는 Supabase(시드니 리전)에 붙는다. 왕복 지연이 붙으므로 기본 60초보다 넉넉히 준다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 3) WebSocket. 시뮬레이션 실시간 채널이다.
    #    엔드포인트 /ws/sim · 페이로드는 배치 단위 전체 스냅샷이다.
    #    프로토콜은 브라우저 WebSocket 위에 STOMP 를 얹은 형태다(@stomp/stompjs).
    #    SockJS 가 아니므로 폴백 경로가 없다. 업그레이드에 실패하면 조용히 멈춘다.
    #    구독 대상은 /topic/sim 이다. simulationSocketService.ts 참조.
    #
    #    함정: 화면이 /api/ws/sim 으로 접속하면 이 블록이 아니라 위의 location /api/ 에 걸린다.
    #          Upgrade 헤더 없이 프록시되어 핸드셰이크가 실패한다.
    #          socketClient 는 REST 기본 경로를 WebSocket 주소에 붙이면 안 된다.
    #    인증: 브라우저 WebSocket 은 커스텀 헤더를 못 붙인다. 토큰은 쿠키로 간다.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $websocket_forwarded_proto;

        # 시뮬레이션은 셀당 수십 초가 걸린다. 그동안 메시지가 없으면 유휴로 보인다.
        # 기본 60초로 두면 배치 중간에 소켓이 끊기고 화면이 멈춘다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4) SSE 로그 스트림. aiLogService.ts 가 EventSource('/ai/logs/stream?jobId=..') 로 연다.
    #    vite dev 프록시가 /ai 를 벗겨 ai-infer(8000)로 보내므로 여기도 같게 벗긴다.
    #
    #    upstream 을 변수로 두는 이유: proxy_pass 에 호스트명을 리터럴로 쓰면 nginx 가
    #    기동 시점에 DNS 를 풀고, 실패하면 컨테이너가 아예 뜨지 않는다. ai-infer 는
    #    compose 의 --profile ai 를 켰을 때만 존재하므로, GPU 없이 화면·백엔드만 띄우는
    #    개발자까지 화면이 죽는다. 변수로 쓰면 요청 시점에 해석하므로 ai-infer 가 없을 때
    #    /ai/logs 만 502 가 되고 화면은 정상으로 뜬다.
    #    변수를 쓰는 proxy_pass 는 URI 를 자동으로 붙여주지 않으므로 직접 적는다.
    #
    #    주의: ai-infer 는 인증이 없는 추론 서버다. 여기서 여는 것은 로그 스트림뿐이고
    #          /ai/ 전체를 열지 않는다. /ai/infer/* 나 /ai/cells/* 를 외부에 열면
    #          누구나 GPU 를 쓸 수 있다. 추론 호출은 백엔드가 내부망에서만 한다.
    #
    #    현재 ai-infer 에 /logs/stream 이 아직 없다. 배선만 먼저 넣어 둔다.
    location ~ ^/ai/(logs/.*)$ {
        set $ai_upstream ai-infer:8000;
        proxy_pass http://$ai_upstream/$1$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 3종 세트. 하나라도 빠지면 스트림이 흐르지 않고 뭉쳐서 한 번에 나온다.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;

        proxy_read_timeout 3600s;
    }
}
