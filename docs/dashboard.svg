<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1628 856" width="1628" height="856" font-family="Pretendard, -apple-system, BlinkMacSystemFont, sans-serif">

  <!-- ══════════════════════════════════════════════════════════
       배경
  ══════════════════════════════════════════════════════════ -->
  <rect width="1628" height="856" fill="#f8f9fa"/>

