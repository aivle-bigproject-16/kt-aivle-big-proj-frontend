<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 350" width="1580" height="350" font-family="Pretendard, -apple-system, sans-serif">

  <!-- 배경 컨테이너 -->
  <rect x="0" y="0" width="1580" height="350" rx="12" ry="12" fill="#ffffff" stroke="#e9bcb6" stroke-width="1"/>

  <!-- 헤더 -->
  <text x="16" y="38" font-size="18" font-weight="700" fill="#191c1d">Live Monitoring Flow</text>

  <!-- Sim Control 버튼 -->
  <rect x="1380" y="14" width="184" height="32" rx="6" fill="#fff" stroke="#e9bcb6" stroke-width="1"/>
  <text x="1472" y="34" font-size="13" font-weight="500" fill="#5b5f63" text-anchor="middle">⚙ Sim Control (시뮬레이션 제어)</text>

  <!-- ── 카드 1: 대기 (PENDING) ── -->
  <rect x="16" y="68" width="265" height="245" rx="10" fill="#fff" stroke="#191c1d" stroke-width="2"/>
  <!-- 라벨 -->
  <text x="32" y="96" font-size="15" font-weight="600" fill="#5b5f63">대기 (PENDING)</text>
  <!-- 아이콘 자리 -->
  <rect x="244" y="78" width="22" height="22" rx="4" fill="#f0f0f0"/>
  <!-- 숫자 -->
  <text x="32" y="180" font-size="45" font-weight="700" fill="#191c1d">0</text>
  <text x="82" y="180" font-size="22" fill="#5b5f63">units</text>
  <!-- 프로그레스 바 트랙 -->
  <rect x="32" y="255" width="233" height="4" rx="2" fill="#f0f0f0"/>
  <rect x="32" y="255" width="0" height="4" rx="2" fill="#e60012"/>

  <!-- 커넥터 1 (수평선) -->
  <line x1="281" y1="190" x2="326" y2="190" stroke="#191c1d" stroke-width="1"/>

  <!-- ── 카드 2: 촬영 (CAPTURING) ── -->
  <rect x="326" y="68" width="265" height="245" rx="10" fill="#fff" stroke="#191c1d" stroke-width="2"/>
  <text x="342" y="96" font-size="15" font-weight="600" fill="#5b5f63">촬영 (CAPTURING)</text>
  <rect x="554" y="78" width="22" height="22" rx="4" fill="#ffe5e5"/>
  <text x="342" y="180" font-size="45" font-weight="700" fill="#191c1d">0</text>
  <text x="392" y="180" font-size="22" fill="#5b5f63">active</text>
  <!-- 배치 ID 자리 -->
  <text x="342" y="228" font-size="20" font-weight="600" fill="#5b5f63">—</text>
  <!-- 프로그레스 바 트랙 -->
  <rect x="342" y="255" width="233" height="4" rx="2" fill="#f0f0f0"/>
  <rect x="342" y="255" width="0" height="4" rx="2" fill="#e60012"/>

  <!-- 커넥터 2 (수평선) -->
  <line x1="591" y1="190" x2="636" y2="190" stroke="#191c1d" stroke-width="1"/>

  <!-- ── 카드 3: 분석 (ANALYSIS) ── -->
  <rect x="636" y="68" width="265" height="245" rx="10" fill="#fff" stroke="#191c1d" stroke-width="2"/>
  <text x="652" y="96" font-size="15" font-weight="600" fill="#5b5f63">분석 (ANALYSIS)</text>
  <rect x="864" y="78" width="22" height="22" rx="4" fill="#ffe5e5"/>
  <text x="652" y="180" font-size="45" font-weight="700" fill="#191c1d">0</text>
  <text x="702" y="180" font-size="22" fill="#5b5f63">queued</text>
  <rect x="652" y="255" width="233" height="4" rx="2" fill="#f0f0f0"/>

  <!-- ── 분기 커넥터 ── -->
  <!-- 수평 줄기 -->
  <line x1="901" y1="190" x2="946" y2="190" stroke="#191c1d" stroke-width="1"/>
  <!-- 수직 분기 -->
  <line x1="946" y1="132" x2="946" y2="248" stroke="#191c1d" stroke-width="1"/>
  <!-- 위 가지 -->
  <line x1="946" y1="132" x2="991" y2="132" stroke="#191c1d" stroke-width="1"/>
  <!-- 아래 가지 -->
  <line x1="946" y1="248" x2="991" y2="248" stroke="#191c1d" stroke-width="1"/>

  <!-- ── 카드 4: 정상 (PASS) ── -->
  <rect x="991" y="90" width="255" height="115" rx="10" fill="#fff" stroke="#191c1d" stroke-width="2"/>
  <text x="1007" y="116" font-size="15" font-weight="600" fill="#5b5f63">정상 (PASS)</text>
  <rect x="1220" y="98" width="18" height="18" rx="3" fill="#f0f0f0"/>
  <text x="1007" y="178" font-size="30" font-weight="700" fill="#191c1d">0</text>
  <text x="1047" y="178" font-size="16" fill="#5b5f63">units</text>
  <rect x="1007" y="190" width="223" height="4" rx="2" fill="#f0f0f0"/>

  <!-- 가로 커넥터 (불량-실패 사이) -->
  <line x1="1246" y1="248" x2="1270" y2="248" stroke="#191c1d" stroke-width="1"/>

  <!-- ── 카드 5: 불량 (REJECT) ── -->
  <rect x="991" y="218" width="255" height="115" rx="10" fill="#fff" stroke="#191c1d" stroke-width="2"/>
  <text x="1007" y="244" font-size="15" font-weight="600" fill="#5b5f63">불량 (REJECT)</text>
  <rect x="1220" y="226" width="18" height="18" rx="3" fill="#ffe5e5"/>
  <text x="1007" y="306" font-size="30" font-weight="700" fill="#191c1d">0</text>
  <text x="1047" y="306" font-size="16" fill="#5b5f63">units</text>
  <rect x="1007" y="318" width="223" height="4" rx="2" fill="#f0f0f0"/>

  <!-- ── 카드 6: 검사 실패 (FAIL) ── -->
  <rect x="1270" y="218" width="255" height="115" rx="10" fill="#fff" stroke="#191c1d" stroke-width="2"/>
  <text x="1286" y="244" font-size="15" font-weight="600" fill="#5b5f63">검사 실패 (FAIL)</text>
  <rect x="1499" y="226" width="18" height="18" rx="3" fill="#ffe5e5"/>
  <text x="1286" y="306" font-size="30" font-weight="700" fill="#191c1d">0</text>
  <text x="1326" y="306" font-size="16" fill="#5b5f63">units</text>
  <rect x="1286" y="318" width="223" height="4" rx="2" fill="#f0f0f0"/>

</svg>
