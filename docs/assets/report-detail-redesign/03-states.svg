<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1646 1140" width="1646" height="1140" font-family="Inter, system-ui, 'Pretendard', sans-serif">
  <title>리포트 상세 상태 변형</title>
  <desc>PENDING · FAILED · 로딩 · 조회 실패. 헤더는 어느 상태에서도 표시한다. SVG 1단위 = 디자인 1px = 0.1rem</desc>

  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1646" height="1140" fill="#ededed"/>

  <text x="60" y="52" font-size="24" font-weight="700" fill="#191c1d">리포트 상세 상태 변형</text>
  <text x="60" y="78" font-size="13" fill="#5b5f63">헤더는 어느 상태에서도 표시한다. 본문 자리만 교체된다. status 는 PENDING · COMPLETED · FAILED 3값이다 (Core §6.6).</text>
  <line x1="60" y1="96" x2="1586" y2="96" stroke="#e1e5ea" stroke-width="1"/>

  <!-- ============ A. PENDING ============ -->
  <text x="60" y="136" font-size="11" letter-spacing="1.1" fill="#0C5795" font-family="ui-monospace, Consolas, monospace">A</text>
  <text x="84" y="136" font-size="17" font-weight="650" fill="#191c1d">PENDING — 생성 중</text>
  <text x="60" y="158" font-size="12.5" fill="#5b5f63">완료를 알리는 WS report.ready 이벤트가 확정되어 있지 않고 FE 도 구독하지 않는다. 자동 갱신 수단이 없으므로 수동 재조회 버튼이 필요하다.</text>

  <g transform="translate(60,176)">
    <!-- 헤더 -->
    <rect x="0" y="0" width="740" height="96" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <rect x="24" y="22" width="118" height="24" fill="#f3f4f6"/>
    <text x="83" y="38" text-anchor="middle" font-size="11.5" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">CELL-1026-A</text>
    <rect x="154" y="22" width="82" height="24" fill="#EBF8F9"/>
    <circle cx="167" cy="34" r="4" fill="#13777C"/>
    <text x="200" y="38" text-anchor="middle" font-size="11.5" letter-spacing="0.6" fill="#13777C" font-family="ui-monospace, Consolas, monospace">PENDING</text>
    <text x="24" y="76" font-size="20" font-weight="700" fill="#9ca3af">개별 리포트 #32</text>
    <text x="716" y="38" text-anchor="end" font-size="13" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">RPT-32</text>

    <!-- 본문 자리 -->
    <rect x="0" y="112" width="740" height="300" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <g transform="translate(370,232)">
      <circle cx="0" cy="-42" r="20" fill="none" stroke="#D3EEEF" stroke-width="4"/>
      <path d="M0 -62 a20 20 0 0 1 20 20" fill="none" stroke="#13777C" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="10" text-anchor="middle" font-size="17" font-weight="600" fill="#191c1d">리포트를 생성하고 있습니다</text>
      <text x="0" y="36" text-anchor="middle" font-size="13" fill="#5b5f63">LLM 처리가 끝나면 본문이 표시됩니다</text>
      <rect x="-56" y="58" width="112" height="36" rx="8" fill="#ffffff" stroke="#0C5795" stroke-width="1.2"/>
      <path d="M-24 76 a7 7 0 1 1 2 5" fill="none" stroke="#0C5795" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-24 70 v6 h6" fill="none" stroke="#0C5795" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="8" y="81" text-anchor="middle" font-size="13" font-weight="600" fill="#0C5795">새로고침</text>
    </g>
  </g>

  <!-- ============ B. FAILED ============ -->
  <text x="846" y="136" font-size="11" letter-spacing="1.1" fill="#0C5795" font-family="ui-monospace, Consolas, monospace">B</text>
  <text x="870" y="136" font-size="17" font-weight="650" fill="#191c1d">FAILED — 생성 실패</text>
  <text x="846" y="158" font-size="12.5" fill="#5b5f63">사유는 Core §6.8 의 리포트 실패 5값이다. AI 실패 사유(§6.4)와 섞지 않는다.</text>

  <g transform="translate(846,176)">
    <rect x="0" y="0" width="740" height="96" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <rect x="24" y="22" width="118" height="24" fill="#f3f4f6"/>
    <text x="83" y="38" text-anchor="middle" font-size="11.5" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">CELL-1022-C</text>
    <rect x="154" y="22" width="74" height="24" fill="none" stroke="#dc2626" stroke-width="1"/>
    <path d="M167 30 l5 8 h-10 z" fill="#dc2626"/>
    <text x="197" y="38" text-anchor="middle" font-size="11.5" letter-spacing="0.6" fill="#dc2626" font-family="ui-monospace, Consolas, monospace">FAILED</text>
    <text x="24" y="76" font-size="20" font-weight="700" fill="#9ca3af">개별 리포트 #28</text>
    <text x="716" y="38" text-anchor="end" font-size="13" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">RPT-28</text>

    <rect x="0" y="112" width="740" height="300" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <g transform="translate(370,222)">
      <circle cx="0" cy="-38" r="26" fill="#fef2f2"/>
      <path d="M0 -50 l10 17 h-20 z" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 -44 v5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-36" r="1.2" fill="#dc2626"/>
      <text x="0" y="14" text-anchor="middle" font-size="17" font-weight="600" fill="#191c1d">리포트 생성에 실패했습니다</text>
      <text x="0" y="40" text-anchor="middle" font-size="13" fill="#5b5f63">리포트 생성 시간이 초과되었습니다</text>
      <text x="0" y="60" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">VLM_TIMEOUT</text>
      <rect x="-52" y="80" width="104" height="36" rx="8" fill="#0C5795"/>
      <text x="0" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">재생성</text>
    </g>
    <text x="370" y="392" text-anchor="middle" font-size="11" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">재생성 → POST /reports/* { forceRegenerate: true } → 새 reportId 로 이동</text>
  </g>

  <!-- ============ C. 로딩 ============ -->
  <text x="60" y="666" font-size="11" letter-spacing="1.1" fill="#0C5795" font-family="ui-monospace, Consolas, monospace">C</text>
  <text x="84" y="666" font-size="17" font-weight="650" fill="#191c1d">조회 중 — 스켈레톤</text>
  <text x="60" y="688" font-size="12.5" fill="#5b5f63">헤더와 카드 골격을 그대로 유지한 채 값만 회색 바로 채운다. LIST_REDESIGN.md §7.1 과 동일 규격이다.</text>

  <g transform="translate(60,706)">
    <rect x="0" y="0" width="740" height="96" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <g fill="#eceef0">
      <rect x="24" y="24" width="118" height="20" rx="4"/>
      <rect x="154" y="24" width="82" height="20" rx="4"/>
      <rect x="24" y="60" width="300" height="22" rx="4"/>
      <rect x="620" y="26" width="96" height="16" rx="4"/>
    </g>

    <rect x="0" y="112" width="470" height="288" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <g fill="#eceef0">
      <rect x="24" y="136" width="120" height="16" rx="4"/>
      <rect x="24" y="164" width="422" height="180" rx="12"/>
      <rect x="24" y="360" width="200" height="14" rx="4"/>
    </g>

    <rect x="490" y="112" width="250" height="288" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <g fill="#eceef0">
      <rect x="514" y="136" width="100" height="16" rx="4"/>
      <rect x="514" y="168" width="88" height="24" rx="2"/>
      <rect x="514" y="212" width="60" height="12" rx="4"/>
      <rect x="514" y="232" width="110" height="28" rx="4"/>
      <rect x="514" y="278" width="60" height="12" rx="4"/>
      <rect x="514" y="298" width="90" height="28" rx="4"/>
      <rect x="514" y="344" width="180" height="14" rx="4"/>
      <rect x="514" y="366" width="150" height="14" rx="4"/>
    </g>
  </g>

  <!-- ============ D. 조회 실패 ============ -->
  <text x="846" y="666" font-size="11" letter-spacing="1.1" fill="#0C5795" font-family="ui-monospace, Consolas, monospace">D</text>
  <text x="870" y="666" font-size="17" font-weight="650" fill="#191c1d">부분 실패 — 3D 뷰만 못 불러옴</text>
  <text x="846" y="688" font-size="12.5" fill="#5b5f63">3D 뷰는 별도 엔드포인트(/cell-view)라 독립적으로 실패한다. 한 카드의 실패가 화면 전체를 막지 않는다.</text>

  <g transform="translate(846,706)">
    <rect x="0" y="0" width="740" height="96" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <rect x="24" y="22" width="118" height="24" fill="#f3f4f6"/>
    <text x="83" y="38" text-anchor="middle" font-size="11.5" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">CELL-1027-A</text>
    <text x="154" y="40" font-size="11.5" letter-spacing="0.6" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">COMPLETED</text>
    <text x="24" y="76" font-size="20" font-weight="700" fill="#191c1d">CT 미세결함 3건 — 재검 권고</text>
    <text x="716" y="38" text-anchor="end" font-size="13" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">RPT-31</text>

    <!-- 3D 뷰 카드만 에러 -->
    <rect x="0" y="112" width="470" height="288" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="24" y="146" font-size="14" font-weight="600" fill="#5b5f63">셀 3D 결함 뷰</text>
    <g transform="translate(235,268)">
      <circle cx="0" cy="-42" r="22" fill="#fef2f2"/>
      <path d="M0 -52 l8 14 h-16 z" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M0 -47 v4" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="-40" r="1" fill="#dc2626"/>
      <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="600" fill="#191c1d">3D 뷰를 불러오지 못했습니다</text>
      <text x="0" y="22" text-anchor="middle" font-size="11.5" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">셀 결함 뷰 조회에 실패했습니다.</text>
      <rect x="-46" y="40" width="92" height="32" fill="#ffffff" stroke="#0C5795" stroke-width="1.2"/>
      <text x="0" y="61" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0C5795">다시 시도</text>
    </g>

    <!-- 지표 카드는 정상 -->
    <rect x="490" y="112" width="250" height="288" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="514" y="146" font-size="14" font-weight="600" fill="#5b5f63">결함 지표</text>
    <rect x="514" y="164" width="96" height="26" fill="#fef2f2"/>
    <path d="M528 173 l5 8 h-10 z" fill="#dc2626"/>
    <text x="570" y="181" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dc2626">위험도 높음</text>
    <text x="514" y="222" font-size="11" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">DVF</text>
    <text x="514" y="256" font-size="26" font-weight="700" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">1,240</text>
    <text x="514" y="292" font-size="11" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">결함 수</text>
    <text x="514" y="326" font-size="26" font-weight="700" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">14</text>
    <text x="514" y="368" font-size="11" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">지표는 정상 표시된다</text>
  </g>

  <!-- 하단 규칙 -->
  <g transform="translate(60,1064)">
    <rect x="0" y="0" width="1526" height="58" rx="8" fill="#EEF6FE"/>
    <rect x="0" y="0" width="4" height="58" fill="#0C5795"/>
    <text x="24" y="26" font-size="12.5" font-weight="600" fill="#0C5795">값이 없으면 없다고 말한다 (§1.2)</text>
    <text x="24" y="46" font-size="12" fill="#5b5f63">개별 리포트는 REJECT 또는 FAIL 검사에만 생성되므로 결함 0건 리포트는 원칙적으로 존재하지 않는다. 0이 표시되면 정상값이 아니라 데이터 결손 신호이므로 "확인 필요"로 표기한다.</text>
  </g>
</svg>
