  <!-- 비교 메모 -->
  <g>
    <rect x="243" y="778" width="568" height="130" rx="12" fill="#ffffff"/>
    <rect x="243" y="778" width="4" height="130" fill="#1e7e34"/>
    <text x="267" y="804" font-size="13" font-weight="600" fill="#1e7e34">이 안의 이점</text>
    <text x="267" y="828" font-size="12" fill="#5b5f63">두 테이블의 복붙 구조가 구조적으로 사라진다 (§1.4 유령 컬럼 사고 방지)</text>
    <text x="267" y="850" font-size="12" fill="#5b5f63">스토어가 하나로 합쳐지고 필터·검색·정렬 로직이 한 벌만 존재한다</text>
    <text x="267" y="872" font-size="12" fill="#5b5f63">사이드바가 이미 하나로 묶어 보여주는 인지 모델과 일치한다</text>
    <text x="267" y="894" font-size="12" fill="#5b5f63">대시보드 완료탭의 "병렬 → 필터 1축" 전환과 같은 패턴이다</text>
  </g>

  <g>
    <rect x="835" y="778" width="568" height="130" rx="12" fill="#ffffff"/>
    <rect x="835" y="778" width="4" height="130" fill="#d97706"/>
    <text x="859" y="804" font-size="13" font-weight="600" fill="#d97706">이 안의 대가</text>
    <text x="859" y="828" font-size="12" fill="#5b5f63">타입마다 필드가 달라 한 컬럼이 의미를 갈아탄다 (기준일 ↔ 대상 셀·회차)</text>
    <text x="859" y="850" font-size="12" fill="#5b5f63">"타입" 컬럼이 추가되어 제목 컬럼 폭이 줄어든다</text>
    <text x="859" y="872" font-size="12" fill="#5b5f63">라우트가 바뀌므로 사이드바 matchPrefix·기존 링크를 함께 정리해야 한다</text>
    <text x="859" y="894" font-size="12" fill="#5b5f63">일일 · 개별의 sort 기준이 달라 정렬 토글 의미가 흐려질 수 있다</text>
  </g>
</svg>
