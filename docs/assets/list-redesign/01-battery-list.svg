  <!-- 주석 -->
  <text x="243" y="860" font-size="11" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">행 클릭이 상세 진입을 전담한다 (FR-LIST-005). 별도 상세 컬럼·# 컬럼 없음. hover 시 배경 brand-50 + 우측 chevron</text>
  <text x="243" y="880" font-size="11" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">REJECT = 채운 배지 + 원형 마커 / FAIL = 테두리 배지 + 삼각 마커 — 색상각 31도 이격 보완 (§6.3)</text>
