<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1646 1180" width="1646" height="1180" font-family="Inter, system-ui, 'Pretendard', sans-serif">
  <title>목록 상태 변형 4종</title>
  <desc>로딩 스켈레톤 · 데이터 0건 · 필터 결과 0건 · 에러. 테이블 카드 영역만 발췌. SVG 1단위 = 디자인 1px = 0.1rem</desc>

  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1646" height="1180" fill="#ededed"/>

  <text x="60" y="52" font-size="24" font-weight="700" fill="#191c1d">목록 상태 변형</text>
  <text x="60" y="78" font-size="13" fill="#5b5f63">툴바와 헤더는 어느 상태에서도 덮지 않는다. 필터 조작은 로딩 중에도 가능해야 한다.</text>
  <line x1="60" y1="96" x2="1586" y2="96" stroke="#e1e5ea" stroke-width="1"/>

  <!-- ============ A. 로딩 스켈레톤 ============ -->
  <text x="60" y="136" font-size="11" letter-spacing="1.1" fill="#0C5795" font-family="ui-monospace, Consolas, monospace">A</text>
  <text x="84" y="136" font-size="17" font-weight="650" fill="#191c1d">로딩 — 스켈레톤 8행</text>
  <text x="60" y="158" font-size="12.5" fill="#5b5f63">최종 레이아웃과 같은 높이라 로딩이 끝나도 시프트가 없다. 바 폭은 컬럼별로 60~90%로 달리해 기계적으로 보이지 않게 한다.</text>

  <g transform="translate(60,176)">
    <rect x="0" y="0" width="740" height="420" rx="15" fill="#ffffff" filter="url(#sh)"/>

    <!-- 헤더 행은 실제 텍스트 유지 -->
    <text x="24" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 시리얼</text>
    <text x="204" y="46" font-size="13" font-weight="600" fill="#5b5f63">모델</text>
    <text x="344" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 유형</text>
    <text x="464" y="46" font-size="13" font-weight="600" fill="#5b5f63">최근 검사</text>
    <text x="624" y="46" font-size="13" font-weight="600" fill="#5b5f63">판정</text>
    <line x1="24" y1="60" x2="716" y2="60" stroke="#eceef0" stroke-width="1"/>

    <g fill="#eceef0">
      <rect x="24" y="80" width="140" height="14" rx="4"/><rect x="204" y="80" width="104" height="14" rx="4"/><rect x="344" y="80" width="72" height="14" rx="4"/><rect x="464" y="80" width="132" height="14" rx="4"/><rect x="624" y="80" width="80" height="14" rx="4"/>
      <rect x="24" y="122" width="124" height="14" rx="4"/><rect x="204" y="122" width="112" height="14" rx="4"/><rect x="344" y="122" width="72" height="14" rx="4"/><rect x="464" y="122" width="132" height="14" rx="4"/><rect x="624" y="122" width="68" height="14" rx="4"/>
      <rect x="24" y="164" width="148" height="14" rx="4"/><rect x="204" y="164" width="96" height="14" rx="4"/><rect x="344" y="164" width="72" height="14" rx="4"/><rect x="464" y="164" width="132" height="14" rx="4"/><rect x="624" y="164" width="80" height="14" rx="4"/>
      <rect x="24" y="206" width="132" height="14" rx="4"/><rect x="204" y="206" width="108" height="14" rx="4"/><rect x="344" y="206" width="72" height="14" rx="4"/><rect x="464" y="206" width="132" height="14" rx="4"/><rect x="624" y="206" width="68" height="14" rx="4"/>
      <rect x="24" y="248" width="140" height="14" rx="4"/><rect x="204" y="248" width="100" height="14" rx="4"/><rect x="344" y="248" width="72" height="14" rx="4"/><rect x="464" y="248" width="132" height="14" rx="4"/><rect x="624" y="248" width="80" height="14" rx="4"/>
      <rect x="24" y="290" width="120" height="14" rx="4"/><rect x="204" y="290" width="116" height="14" rx="4"/><rect x="344" y="290" width="72" height="14" rx="4"/><rect x="464" y="290" width="132" height="14" rx="4"/><rect x="624" y="290" width="68" height="14" rx="4"/>
      <rect x="24" y="332" width="144" height="14" rx="4"/><rect x="204" y="332" width="96" height="14" rx="4"/><rect x="344" y="332" width="72" height="14" rx="4"/><rect x="464" y="332" width="132" height="14" rx="4"/><rect x="624" y="332" width="80" height="14" rx="4"/>
      <rect x="24" y="374" width="128" height="14" rx="4"/><rect x="204" y="374" width="104" height="14" rx="4"/><rect x="344" y="374" width="72" height="14" rx="4"/><rect x="464" y="374" width="132" height="14" rx="4"/><rect x="624" y="374" width="68" height="14" rx="4"/>
    </g>
  </g>

  <!-- ============ B. 데이터 0건 ============ -->
  <text x="846" y="136" font-size="11" letter-spacing="1.1" fill="#0C5795" font-family="ui-monospace, Consolas, monospace">B</text>
  <text x="870" y="136" font-size="17" font-weight="650" fill="#191c1d">데이터 자체가 0건</text>
  <text x="846" y="158" font-size="12.5" fill="#5b5f63">해결책이 "기다리거나 만들기"다. 일일 리포트에만 생성 CTA를 둔다.</text>

  <g transform="translate(846,176)">
    <rect x="0" y="0" width="740" height="420" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="24" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 시리얼</text>
    <text x="204" y="46" font-size="13" font-weight="600" fill="#5b5f63">모델</text>
    <text x="344" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 유형</text>
    <text x="464" y="46" font-size="13" font-weight="600" fill="#5b5f63">최근 검사</text>
    <text x="624" y="46" font-size="13" font-weight="600" fill="#5b5f63">판정</text>
    <line x1="24" y1="60" x2="716" y2="60" stroke="#eceef0" stroke-width="1"/>

    <g transform="translate(370,230)">
      <rect x="-28" y="-92" width="56" height="56" rx="8" fill="#f3f4f6"/>
      <rect x="-13" y="-79" width="26" height="30" rx="4" fill="none" stroke="#c3c8cd" stroke-width="2"/>
      <rect x="-6" y="-83" width="12" height="4" rx="2" fill="#c3c8cd"/>
      <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="600" fill="#191c1d">아직 검사된 배터리가 없습니다</text>
      <text x="0" y="16" text-anchor="middle" font-size="13" fill="#5b5f63">시뮬레이션을 실행하면 검사 결과가 이곳에 쌓입니다</text>
    </g>

    <text x="370" y="380" text-anchor="middle" font-size="11" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">일일 리포트 화면에서는 이 자리에 [+ 리포트 생성] CTA</text>
  </g>

  <!-- ============ C. 필터 결과 0건 ============ -->
  <text x="60" y="666" font-size="11" letter-spacing="1.1" fill="#0C5795" font-family="ui-monospace, Consolas, monospace">C</text>
  <text x="84" y="666" font-size="17" font-weight="650" fill="#191c1d">필터·검색 결과가 0건</text>
  <text x="60" y="688" font-size="12.5" fill="#5b5f63">해결책이 "필터 풀기"라 B와 정반대다. 같은 문구를 쓰면 필터를 켜둔 것을 모르고 "데이터가 없다"로 오해한다.</text>

  <g transform="translate(60,706)">
    <!-- 툴바를 함께 그려 필터가 켜져 있음을 보인다 -->
    <rect x="0" y="0" width="110" height="32" fill="#ffffff"/>
    <text x="38" y="20" text-anchor="middle" font-size="13" font-weight="500" fill="#5b5f63">전체</text>
    <rect x="120" y="0" width="124" height="32" fill="#0C5795"/>
    <path d="M141 12 l5 8 h-10 z" fill="#ffffff"/>
    <text x="185" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">FAIL</text>
    <text x="222" y="20" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.75" font-family="ui-monospace, Consolas, monospace">0</text>
    <rect x="480" y="0" width="240" height="32" fill="#ffffff"/>
    <circle cx="501" cy="16" r="5.5" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
    <path d="M505 20 l4 4" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
    <text x="517" y="21" font-size="13" fill="#191c1d">CELL-99</text>
    <circle cx="700" cy="16" r="8" fill="#eceef0"/>
    <path d="M697 13 l6 6 M703 13 l-6 6" stroke="#5b5f63" stroke-width="1.4" stroke-linecap="round"/>

    <rect x="0" y="48" width="740" height="372" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="24" y="94" font-size="13" font-weight="600" fill="#5b5f63">셀 시리얼</text>
    <text x="204" y="94" font-size="13" font-weight="600" fill="#5b5f63">모델</text>
    <text x="344" y="94" font-size="13" font-weight="600" fill="#5b5f63">셀 유형</text>
    <text x="464" y="94" font-size="13" font-weight="600" fill="#5b5f63">최근 검사</text>
    <text x="624" y="94" font-size="13" font-weight="600" fill="#5b5f63">판정</text>
    <line x1="24" y1="108" x2="716" y2="108" stroke="#eceef0" stroke-width="1"/>

    <g transform="translate(370,258)">
      <circle cx="0" cy="-84" r="26" fill="#f3f4f6"/>
      <circle cx="-4" cy="-88" r="9" fill="none" stroke="#c3c8cd" stroke-width="2"/>
      <path d="M3 -81 l8 8" stroke="#c3c8cd" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="-14" text-anchor="middle" font-size="16" font-weight="600" fill="#191c1d">조건에 맞는 항목이 없습니다</text>
      <text x="0" y="12" text-anchor="middle" font-size="13" fill="#5b5f63">필터 또는 검색어를 조정해 보세요</text>
      <rect x="-56" y="34" width="112" height="34" rx="8" fill="#ffffff" stroke="#0C5795" stroke-width="1.2"/>
      <text x="0" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0C5795">필터 초기화</text>
    </g>
  </g>

  <!-- ============ D. 에러 ============ -->
  <text x="846" y="666" font-size="11" letter-spacing="1.1" fill="#0C5795" font-family="ui-monospace, Consolas, monospace">D</text>
  <text x="870" y="666" font-size="17" font-weight="650" fill="#191c1d">조회 실패</text>
  <text x="846" y="688" font-size="12.5" fill="#5b5f63">FUNC_SPEC §1.4가 자동 재시도를 금지했으므로, 수동 재시도 수단이 없으면 새로고침 외에 방법이 없다.</text>

  <g transform="translate(846,754)">
    <rect x="0" y="0" width="740" height="372" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="24" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 시리얼</text>
    <text x="204" y="46" font-size="13" font-weight="600" fill="#5b5f63">모델</text>
    <text x="344" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 유형</text>
    <text x="464" y="46" font-size="13" font-weight="600" fill="#5b5f63">최근 검사</text>
    <text x="624" y="46" font-size="13" font-weight="600" fill="#5b5f63">판정</text>
    <line x1="24" y1="60" x2="716" y2="60" stroke="#eceef0" stroke-width="1"/>

    <g transform="translate(370,210)">
      <circle cx="0" cy="-84" r="26" fill="#fef2f2"/>
      <path d="M0 -96 l10 17 h-20 z" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 -90 v5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-82" r="1.2" fill="#dc2626"/>
      <text x="0" y="-14" text-anchor="middle" font-size="16" font-weight="600" fill="#191c1d">목록을 불러오지 못했습니다</text>
      <text x="0" y="12" text-anchor="middle" font-size="13" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">배터리 목록 조회에 실패했습니다.</text>
      <rect x="-52" y="34" width="104" height="34" rx="8" fill="#0C5795"/>
      <path d="M-22 51 a6 6 0 1 1 2 4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-22 46 v5 h5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="6" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">다시 시도</text>
    </g>
  </g>

  <!-- 푸터 규칙 메모 -->
  <text x="60" y="1160" font-size="11.5" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">푸터 규칙 — 결과 0건이면 페이지네이션 컨트롤을 숨기고 건수는 "0건"으로만 표기한다 (현행 Pagination 은 totalPages = max(1, ...) 이라 0건에도 1 버튼이 뜬다)</text>
</svg>
