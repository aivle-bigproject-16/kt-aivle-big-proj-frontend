<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, system-ui, 'Pretendard', sans-serif">
  <title>CELLNEX 회원가입 — 개인정보 동의 포함</title>
  <desc>필수 수집 항목, 목적, 보유기간과 비밀번호 정책을 가입 흐름 안에서 확인하는 화면</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03203b" stop-opacity="0.92"/>
      <stop offset="0.52" stop-color="#054477" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#0c5795" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#64a0dd"/><stop offset="1" stop-color="#0c5795"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="28" flood-color="#03203b" flood-opacity="0.12"/></filter>
    <clipPath id="photo"><rect width="1030" height="1080"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="#f7f9fb"/>
  <g clip-path="url(#photo)">
    <image href="../../../src/assets/authBgPic.png" xlink:href="../../../src/assets/authBgPic.png" width="1030" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1030" height="1080" fill="url(#shade)"/>
    <g transform="translate(72 58)">
      <rect width="60" height="60" rx="15" fill="#fff" fill-opacity="0.96"/>
      <image href="../logo_blue.svg" xlink:href="../logo_blue.svg" x="10" y="12" width="40" height="36"/>
      <text x="78" y="31" fill="#fff" font-size="24" font-weight="750" letter-spacing="1.8">CELLNEX</text>
      <text x="79" y="51" fill="#d9eafc" font-size="11" font-weight="650" letter-spacing="1.4">AI BATTERY INSPECTION</text>
    </g>
    <g transform="translate(72 694)">
      <rect width="54" height="5" rx="2.5" fill="#64a0dd"/>
      <text y="73" fill="#fff" font-size="48" font-weight="750" letter-spacing="-1.6">안전한 검사의 시작은</text>
      <text y="132" fill="#fff" font-size="48" font-weight="750" letter-spacing="-1.6">신뢰할 수 있는 계정부터.</text>
      <text y="180" fill="#d9eafc" font-size="18">필요한 정보만 수집하고, 이용 목적을 투명하게 안내합니다.</text>
      <g transform="translate(0 224)">
        <rect width="230" height="48" rx="24" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.25"/>
        <circle cx="25" cy="24" r="9" fill="#85c4c8"/><path d="M21 24l3 3 6-7" fill="none" stroke="#032526" stroke-width="2"/>
        <text x="45" y="30" fill="#fff" font-size="14" font-weight="650">최소 정보 수집</text>
        <g transform="translate(246)">
          <rect width="248" height="48" rx="24" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.25"/>
          <circle cx="25" cy="24" r="9" fill="#8ebcec"/><path d="M21 24l3 3 6-7" fill="none" stroke="#033259" stroke-width="2"/>
          <text x="45" y="30" fill="#fff" font-size="14" font-weight="650">목적·기간 명확화</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(1100 30)">
    <rect width="750" height="1020" rx="22" fill="#fff" filter="url(#shadow)"/>
    <rect width="750" height="5" rx="2.5" fill="url(#line)"/>
    <g transform="translate(56 40)">
      <text y="34" fill="#191c1d" font-size="32" font-weight="750" letter-spacing="-1">새 계정 만들기</text>
      <text y="64" fill="#5b5f63" font-size="14">검사 시스템을 이용할 계정 정보를 입력해 주세요.</text>

      <g transform="translate(0 98)">
        <text y="0" fill="#191c1d" font-size="13" font-weight="650">이름</text>
        <rect y="12" width="306" height="52" rx="9" fill="#fff" stroke="#cfd5da"/>
        <circle cx="24" cy="38" r="7" fill="none" stroke="#7b8187" stroke-width="1.7"/><path d="M13 54c2-8 20-8 22 0" fill="none" stroke="#7b8187" stroke-width="1.7"/>
        <text x="48" y="44" fill="#9ca3af" font-size="13">이름을 입력하세요</text>
        <g transform="translate(330)">
          <text y="0" fill="#191c1d" font-size="13" font-weight="650">이메일(아이디)</text>
          <rect y="12" width="308" height="52" rx="9" fill="#fff" stroke="#cfd5da"/>
          <rect x="14" y="29" width="20" height="15" rx="3" fill="none" stroke="#7b8187" stroke-width="1.7"/><path d="M16 31l8 6 8-6" fill="none" stroke="#7b8187" stroke-width="1.7"/>
          <text x="48" y="44" fill="#9ca3af" font-size="13">name@company.com</text>
        </g>
      </g>

      <g transform="translate(0 188)">
        <text y="0" fill="#191c1d" font-size="13" font-weight="650">비밀번호</text>
        <rect y="12" width="638" height="52" rx="9" fill="#fff" stroke="#0c5795"/>
        <rect x="15" y="29" width="18" height="16" rx="3" fill="none" stroke="#0c5795" stroke-width="1.7"/><path d="M19 29v-3a5 5 0 0110 0v3" fill="none" stroke="#0c5795" stroke-width="1.7"/>
        <text x="48" y="44" fill="#5b5f63" font-size="13">••••••••••••</text>
        <text x="608" y="44" text-anchor="end" fill="#0c5795" font-size="12" font-weight="650">안전</text>
        <g transform="translate(0 76)">
          <rect width="152" height="26" rx="13" fill="#ecfdf3"/><circle cx="14" cy="13" r="6" fill="#1e7e34"/><path d="M11 13l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.5"/>
          <text x="26" y="17" fill="#1e7e34" font-size="11" font-weight="650">8자 이상</text>
          <g transform="translate(162)"><rect width="222" height="26" rx="13" fill="#ecfdf3"/><circle cx="14" cy="13" r="6" fill="#1e7e34"/><path d="M11 13l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.5"/><text x="26" y="17" fill="#1e7e34" font-size="11" font-weight="650">영문·숫자·특수문자 조합</text></g>
          <g transform="translate(394)"><rect width="244" height="26" rx="13" fill="#eef6fe"/><circle cx="14" cy="13" r="6" fill="#0c5795"/><text x="14" y="17" text-anchor="middle" fill="#fff" font-size="10" font-weight="750">i</text><text x="26" y="17" fill="#0c5795" font-size="11" font-weight="650">공통 비밀번호 사용 금지</text></g>
        </g>
      </g>

      <g transform="translate(0 318)">
        <text y="0" fill="#191c1d" font-size="13" font-weight="650">비밀번호 확인</text>
        <rect y="12" width="638" height="52" rx="9" fill="#fff" stroke="#cfd5da"/>
        <rect x="15" y="29" width="18" height="16" rx="3" fill="none" stroke="#7b8187" stroke-width="1.7"/><path d="M19 29v-3a5 5 0 0110 0v3" fill="none" stroke="#7b8187" stroke-width="1.7"/>
        <text x="48" y="44" fill="#9ca3af" font-size="13">비밀번호를 다시 입력하세요</text>
      </g>

      <g transform="translate(0 414)">
        <text y="0" fill="#191c1d" font-size="15" font-weight="720">개인정보 수집·이용 동의</text>
        <text x="638" y="0" text-anchor="end" fill="#9ca3af" font-size="11">동의 전문 보기</text>
        <rect y="18" width="638" height="226" rx="12" fill="#f8fafc" stroke="#d9e2e9"/>
        <g transform="translate(18 34)">
          <rect width="602" height="116" rx="9" fill="#fff" stroke="#e2e6e9"/>
          <text x="16" y="26" fill="#0c5795" font-size="12" font-weight="700">[필수] 계정 생성 및 서비스 이용</text>
          <line x1="16" y1="38" x2="586" y2="38" stroke="#edf0f2"/>
          <text x="16" y="60" fill="#5b5f63" font-size="11.5">수집 항목</text><text x="118" y="60" fill="#191c1d" font-size="11.5">이름, 이메일(아이디)</text>
          <text x="16" y="82" fill="#5b5f63" font-size="11.5">이용 목적</text><text x="118" y="82" fill="#191c1d" font-size="11.5">계정 생성, 사용자 인증, 서비스 권한 관리</text>
          <text x="16" y="104" fill="#5b5f63" font-size="11.5">보유 기간</text><text x="118" y="104" fill="#191c1d" font-size="11.5">회원 탈퇴 시까지 · 운영 정책 확정 필요</text>
        </g>
        <g transform="translate(20 168)">
          <rect width="20" height="20" rx="5" fill="#0c5795"/><path d="M5 10l3 3 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="31" y="15" fill="#191c1d" font-size="12.5" font-weight="650">위 개인정보 수집·이용에 동의합니다.</text>
          <text x="31" y="38" fill="#7b8187" font-size="11">동의를 거부할 수 있으나, 필수 정보 미동의 시 계정 생성이 제한됩니다.</text>
        </g>
      </g>

      <g transform="translate(0 688)">
        <rect width="638" height="56" rx="10" fill="#0c5795"/>
        <text x="319" y="35" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">동의하고 계정 만들기</text>
      </g>
      <text x="319" y="782" text-anchor="middle" fill="#5b5f63" font-size="12.5">이미 계정이 있으신가요? <tspan fill="#0c5795" font-weight="700">로그인</tspan></text>
      <line x1="0" y1="816" x2="638" y2="816" stroke="#edf0f2"/>
      <text y="846" fill="#9ca3af" font-size="10.5">개인정보처리방침</text><text x="638" y="846" text-anchor="end" fill="#9ca3af" font-size="10.5">CELLNEX v1.0</text>
    </g>
  </g>
</svg>
