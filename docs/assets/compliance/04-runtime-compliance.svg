<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, system-ui, 'Pretendard', sans-serif">
  <title>CELLNEX 런타임 규제 준수 통합 화면</title>
  <desc>공통 개인정보처리방침 푸터, 개인정보 마스킹, 관리자 라우트 거부와 CSRF 연동 계약을 보여주는 구현 기준</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#03203b" flood-opacity="0.12"/></filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#03203b"/><stop offset="1" stop-color="#0c5795"/></linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#edf1f4"/>
  <rect width="1920" height="84" fill="url(#header)"/>
  <text x="72" y="36" fill="#8ebcec" font-size="11" font-weight="750" letter-spacing="1.4">CELLNEX DESIGN SYSTEM</text>
  <text x="72" y="63" fill="#fff" font-size="23" font-weight="750">규제 준수 런타임 통합 화면</text>
  <text x="1848" y="52" text-anchor="end" fill="#d9eafc" font-size="12">FE 방어 + BE 최종 검증</text>

  <g transform="translate(72 120)">
    <rect width="1160" height="840" rx="18" fill="#fff" filter="url(#shadow)"/>
    <rect width="230" height="840" rx="18" fill="#03203b"/>
    <text x="28" y="50" fill="#fff" font-size="20" font-weight="800" letter-spacing="1.6">CELLNEX</text>
    <text x="28" y="78" fill="#8ebcec" font-size="10" letter-spacing="1.1">AI BATTERY INSPECTION</text>
    <g transform="translate(18 132)" fill="#b6d6f8" font-size="13">
      <text x="18" y="26">대시보드</text>
      <text x="18" y="78">배터리 목록</text>
      <text x="18" y="130">리포트 목록</text>
      <rect y="156" width="194" height="46" rx="9" fill="#0c5795"/>
      <text x="18" y="184" fill="#fff" font-weight="700">공지사항</text>
    </g>

    <g transform="translate(274 36)">
      <text y="28" fill="#191c1d" font-size="29" font-weight="750">공지사항</text>
      <g transform="translate(686 0)">
        <rect width="152" height="38" rx="19" fill="#ecfdf3"/>
        <circle cx="20" cy="19" r="7" fill="#1e7e34"/>
        <path d="M16 19l3 3 5-7" fill="none" stroke="#fff" stroke-width="1.8"/>
        <text x="34" y="24" fill="#1e7e34" font-size="11" font-weight="700">일반 사용자</text>
      </g>
      <text x="838" y="58" text-anchor="end" fill="#7b8187" font-size="10.5">관리자 작성 버튼은 표시하지 않음</text>

      <rect y="82" width="838" height="584" rx="14" fill="#f8fafc" stroke="#d9e2e9"/>
      <rect x="20" y="104" width="798" height="54" rx="9" fill="#eef6fe"/>
      <text x="42" y="137" fill="#5b5f63" font-size="11" font-weight="650">제목</text>
      <text x="538" y="137" fill="#5b5f63" font-size="11" font-weight="650">작성자</text>
      <text x="690" y="137" fill="#5b5f63" font-size="11" font-weight="650">작성일</text>

      <g font-size="12.5">
        <g transform="translate(20 176)"><rect width="798" height="72" rx="8" fill="#fff"/><text x="22" y="43" fill="#191c1d">시스템 정기 점검 안내</text><text x="518" y="43" fill="#5b5f63">김*준</text><text x="670" y="43" fill="#5b5f63">2026-08-15</text></g>
        <g transform="translate(20 258)"><rect width="798" height="72" rx="8" fill="#fff"/><text x="22" y="43" fill="#191c1d">검사 리포트 기능 업데이트</text><text x="518" y="43" fill="#5b5f63">이*희</text><text x="670" y="43" fill="#5b5f63">2026-08-13</text></g>
        <g transform="translate(20 340)"><rect width="798" height="72" rx="8" fill="#fff"/><text x="22" y="43" fill="#191c1d">개인정보처리방침 시행 안내</text><text x="518" y="43" fill="#5b5f63">관*자</text><text x="670" y="43" fill="#5b5f63">2026-08-13</text></g>
      </g>

      <g transform="translate(20 448)">
        <rect width="798" height="172" rx="10" fill="#fff" stroke="#e2e6e9"/>
        <text x="22" y="34" fill="#0c5795" font-size="12" font-weight="750">공지 상세 개인정보 기본 마스킹</text>
        <line x1="22" y1="48" x2="776" y2="48" stroke="#edf0f2"/>
        <text x="22" y="82" fill="#7b8187" font-size="11">이름</text><text x="130" y="82" fill="#191c1d" font-size="13" font-weight="700">홍*동</text>
        <text x="22" y="113" fill="#7b8187" font-size="11">이메일</text><text x="130" y="113" fill="#191c1d" font-size="13" font-weight="700">ho*****@cellnex.io</text>
        <rect x="566" y="70" width="210" height="56" rx="9" fill="#fffbeb"/>
        <text x="584" y="93" fill="#92400e" font-size="10.5" font-weight="700">원문 응답 제한은 BE 책임</text>
        <text x="584" y="112" fill="#b45309" font-size="9.5">FE 마스킹은 방어 계층</text>
      </g>
    </g>

    <g transform="translate(230 790)">
      <rect width="930" height="50" fill="#f7f9fb"/>
      <text x="24" y="31" fill="#7b8187" font-size="10.5">© 2026 CELLNEX</text>
      <text x="465" y="31" text-anchor="middle" fill="#0c5795" font-size="11" font-weight="700">개인정보처리방침</text>
      <text x="906" y="31" text-anchor="end" fill="#7b8187" font-size="10.5">CELLNEX v1.0</text>
    </g>
  </g>

  <g transform="translate(1270 120)">
    <rect width="578" height="386" rx="18" fill="#fff" filter="url(#shadow)"/>
    <text x="28" y="43" fill="#191c1d" font-size="16" font-weight="750">관리자 라우트 접근 거부</text>
    <rect x="28" y="66" width="522" height="276" rx="13" fill="#f8fafc"/>
    <circle cx="289" cy="132" r="34" fill="#fef2f2"/>
    <path d="M289 113v24M289 150h.1" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
    <text x="289" y="203" text-anchor="middle" fill="#191c1d" font-size="22" font-weight="750">접근 권한이 없습니다</text>
    <text x="289" y="232" text-anchor="middle" fill="#5b5f63" font-size="11.5">FE는 화면을 차단하고 BE는 JWT 역할을 다시 검증합니다.</text>
    <rect x="191" y="260" width="196" height="44" rx="9" fill="#0c5795"/>
    <text x="289" y="287" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">대시보드로 이동</text>

    <g transform="translate(0 420)">
      <rect width="578" height="420" rx="18" fill="#fff" filter="url(#shadow)"/>
      <text x="28" y="43" fill="#191c1d" font-size="16" font-weight="750">상태 변경 요청 CSRF 계약</text>
      <g transform="translate(28 72)">
        <rect width="522" height="88" rx="11" fill="#eef6fe"/>
        <text x="18" y="28" fill="#0c5795" font-size="11" font-weight="750">1. 토큰 발급</text>
        <text x="18" y="52" fill="#191c1d" font-size="12">GET /auth/csrf</text>
        <text x="18" y="72" fill="#5b5f63" font-size="10.5">Set-Cookie: XSRF-TOKEN</text>
      </g>
      <path d="M289 169v26" stroke="#8ebcec" stroke-width="2"/>
      <g transform="translate(28 196)">
        <rect width="522" height="88" rx="11" fill="#ecfdf3"/>
        <text x="18" y="28" fill="#1e7e34" font-size="11" font-weight="750">2. 상태 변경 요청</text>
        <text x="18" y="52" fill="#191c1d" font-size="12">POST · PUT · PATCH · DELETE</text>
        <text x="18" y="72" fill="#5b5f63" font-size="10.5">X-XSRF-TOKEN 헤더 자동 첨부</text>
      </g>
      <g transform="translate(28 306)">
        <rect width="252" height="74" rx="10" fill="#fef2f2"/>
        <text x="16" y="29" fill="#b91c1c" font-size="11" font-weight="750">토큰 누락·불일치</text>
        <text x="16" y="52" fill="#7f1d1d" font-size="12">403 SECURITY_CSRF_INVALID</text>
        <g transform="translate(270)">
          <rect width="252" height="74" rx="10" fill="#ecfdf3"/>
          <text x="16" y="29" fill="#1e7e34" font-size="11" font-weight="750">유효 토큰</text>
          <text x="16" y="52" fill="#14532d" font-size="12">서버 작업 수행</text>
        </g>
      </g>
    </g>
  </g>

  <text x="72" y="1018" fill="#5b5f63" font-size="11.5">판정 원칙: 화면 구현만으로 완료 처리하지 않는다. 동의 이력, 원문 응답 제한, CSRF 검증, 관리자 인가는 BE 통합 테스트가 통과해야 준수다.</text>
</svg>
