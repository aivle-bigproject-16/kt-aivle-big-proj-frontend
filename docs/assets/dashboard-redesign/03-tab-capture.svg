  <g>
    <rect x="243" y="76" width="1160" height="80" rx="15" fill="#ffffff" filter="url(#sh)"/>

    <circle cx="273" cy="116" r="5" fill="#13777C"/>
    <text x="288" y="112" font-size="16" font-weight="600" fill="#5b5f63">촬영</text>
    <text x="288" y="132" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">CAPTURING</text>

    <line x1="392" y1="94" x2="392" y2="138" stroke="#e4e7ea" stroke-width="1"/>

    <text x="416" y="99" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">현재 배치</text>
    <text x="416" y="127" font-size="32" font-weight="700" fill="#191c1d" letter-spacing="-1">6</text>
    <text x="438" y="127" font-size="15" fill="#5b5f63">active</text>

    <line x1="530" y1="94" x2="530" y2="138" stroke="#e4e7ea" stroke-width="1"/>

    <text x="554" y="99" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">촬영 완료</text>
    <text x="554" y="127" font-size="20" font-weight="700" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">4</text>

    <text x="650" y="99" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">촬영 속도</text>
    <text x="650" y="127" font-size="20" font-weight="700" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">5.0s</text>

    <text x="762" y="99" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">현재 배치</text>
    <text x="762" y="127" font-size="20" font-weight="700" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">#3</text>

    <!-- 장식: 스캐너 (탭당 1개) -->
    <g>
      <rect x="900" y="98" width="240" height="44" rx="8" fill="#EBF8F9"/>
      <rect x="1004" y="106" width="20" height="28" rx="4" fill="none" stroke="#13777C" stroke-width="1.8"/>
      <rect x="1009" y="102" width="10" height="4" rx="999" fill="#13777C"/>
      <line x1="912" y1="120" x2="1128" y2="120" stroke="#13777C" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55"/>
      <rect x="960" y="98" width="3" height="44" fill="#13777C" opacity="0.85"/>
      <text x="1020" y="92" text-anchor="middle" font-size="10" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">SCANNER · 촬영 탭 전용 장식</text>
    </g>

    <rect x="1269" y="103" width="110" height="26" fill="#ecfdf3" stroke="#bfe3c9" stroke-width="1"/>
    <circle cx="1284" cy="116" r="3" fill="#1e7e34"/>
    <text x="1294" y="120" font-size="11" letter-spacing="0.7" fill="#1e7e34" font-family="ui-monospace, Consolas, monospace">LIVE · 연결됨</text>
  </g>

  <!-- ================= 목록 영역 (내부 스크롤) ================= -->
  <g>
    <rect x="243" y="172" width="1160" height="712" rx="15" fill="#ffffff" filter="url(#sh)"/>

    <!-- 현재 배치 — 펼침 -->
    <rect x="267" y="196" width="1112" height="48" rx="8" fill="#EBF8F9"/>
    <rect x="267" y="196" width="4" height="48" fill="#13777C"/>
    <path d="M291 214 l7 7 l7 -7" stroke="#13777C" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="316" y="226" font-size="14" font-weight="600" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">Batch #3</text>
    <text x="408" y="226" font-size="12" fill="#5b5f63">6 cells · 촬영 중</text>
    <text x="1359" y="226" text-anchor="end" font-size="11.5" fill="#13777C" font-family="ui-monospace, Consolas, monospace">진행 4 / 6</text>

    <!-- 촬영 진행바 -->
    <rect x="267" y="256" width="1112" height="4" rx="999" fill="#D3EEEF"/>
    <rect x="267" y="256" width="741" height="4" rx="999" fill="#13777C"/>

    <!-- 셀 칩: CAPTURED 4 · CAPTURING 1 · 대기 1 -->
    <g>
      <rect x="267" y="276" width="172" height="40" rx="8" fill="#EBF8F9"/>
      <rect x="283" y="286" width="14" height="20" rx="4" fill="#85C4C8"/>
      <text x="309" y="301" font-size="13" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1033</text>
      <text x="423" y="301" text-anchor="end" font-size="10" fill="#5BAAAE" font-family="ui-monospace, Consolas, monospace">DONE</text>
    </g>
    <g>
      <rect x="455" y="276" width="172" height="40" rx="8" fill="#EBF8F9"/>
      <rect x="471" y="286" width="14" height="20" rx="4" fill="#85C4C8"/>
      <text x="497" y="301" font-size="13" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1034</text>
      <text x="611" y="301" text-anchor="end" font-size="10" fill="#5BAAAE" font-family="ui-monospace, Consolas, monospace">DONE</text>
    </g>
    <g>
      <rect x="643" y="276" width="172" height="40" rx="8" fill="#EBF8F9"/>
      <rect x="659" y="286" width="14" height="20" rx="4" fill="#85C4C8"/>
      <text x="685" y="301" font-size="13" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1035</text>
      <text x="799" y="301" text-anchor="end" font-size="10" fill="#5BAAAE" font-family="ui-monospace, Consolas, monospace">DONE</text>
    </g>
    <g>
      <rect x="831" y="276" width="172" height="40" rx="8" fill="#EBF8F9"/>
      <rect x="847" y="286" width="14" height="20" rx="4" fill="#85C4C8"/>
      <text x="873" y="301" font-size="13" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1036</text>
      <text x="987" y="301" text-anchor="end" font-size="10" fill="#5BAAAE" font-family="ui-monospace, Consolas, monospace">DONE</text>
    </g>
    <g>
      <rect x="1019" y="276" width="172" height="40" rx="8" fill="#D3EEEF"/>
      <rect x="1019" y="276" width="3" height="40" fill="#13777C"/>
      <rect x="1035" y="286" width="14" height="20" rx="4" fill="#13777C"/>
      <text x="1061" y="301" font-size="13" font-weight="600" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1037</text>
      <text x="1175" y="301" text-anchor="end" font-size="10" fill="#13777C" font-family="ui-monospace, Consolas, monospace">LIVE</text>
    </g>
    <g>
      <rect x="1207" y="276" width="172" height="40" rx="8" fill="#fafbfc"/>
      <rect x="1223" y="286" width="14" height="20" rx="4" fill="#d6dade"/>
      <text x="1249" y="301" font-size="13" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">CELL-1038</text>
    </g>

    <!-- 직전 배치 — 접힘 -->
    <g>
      <rect x="267" y="344" width="1112" height="48" rx="8" fill="#fafbfc"/>
      <path d="M287 364 l7 -7 l7 7" stroke="#9ca3af" stroke-width="1.8" fill="none" stroke-linecap="round" transform="rotate(90 294 364)"/>
      <text x="312" y="374" font-size="14" font-weight="600" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">Batch #2</text>
      <text x="404" y="374" font-size="12" fill="#9ca3af">6 cells · 촬영 완료</text>
    </g>
    <g>
      <rect x="267" y="404" width="1112" height="48" rx="8" fill="#fafbfc"/>
      <path d="M287 424 l7 -7 l7 7" stroke="#9ca3af" stroke-width="1.8" fill="none" stroke-linecap="round" transform="rotate(90 294 424)"/>
      <text x="312" y="434" font-size="14" font-weight="600" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">Batch #1</text>
      <text x="404" y="434" font-size="12" fill="#9ca3af">6 cells · 촬영 완료</text>
    </g>

    <text x="267" y="500" font-size="11.5" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">촬영 완료(CAPTURED) 셀은 흐린 청록 #85C4C8, 촬영 중(CAPTURING)은 진한 청록 #13777C — 명도로만 구분한다</text>

    <rect x="1387" y="196" width="6" height="200" rx="4" fill="#d0d4d8"/>
  </g>
</svg>
