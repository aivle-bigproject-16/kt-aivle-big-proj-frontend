<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1646 940" width="1646" height="940" font-family="Inter, system-ui, 'Pretendard', sans-serif">
  <title>분석 탭 — ANALYSIS</title>
  <desc>공통 골격: 요약 바(고정) + 목록 영역(분석 대기열 + 현재 분석 중 셀 상세). SVG 1단위 = 디자인 1px = 0.1rem</desc>

  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1646" height="940" fill="#ededed"/>

  <!-- ================= 사이드바 ================= -->
  <g>
    <rect x="68.6" y="30" width="85.7" height="85.7" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="111.4" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0C5795">LOGO</text>
    <text x="111.4" y="140" text-anchor="middle" font-size="12" fill="#5b5f63">슬로건 자리 · 한글 12~16자</text>
    <rect x="16.5" y="128" width="190" height="17" rx="4" fill="none" stroke="#c3c8cd" stroke-width="1" stroke-dasharray="3 3"/>

    <rect x="16.5" y="176" width="190" height="240" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <rect x="32.5" y="196" width="158" height="56" rx="15" fill="#EEF6FE"/>
    <rect x="52" y="212" width="24" height="24" rx="8" fill="#0C5795" opacity="0.9"/>
    <text x="88" y="229" font-size="14" font-weight="600" fill="#0C5795">대시보드</text>
    <rect x="32.5" y="268" width="158" height="56" rx="15" fill="#ededed"/>
    <rect x="52" y="284" width="24" height="24" rx="8" fill="#5b5f63" opacity="0.75"/>
    <text x="88" y="301" font-size="14" font-weight="500" fill="#5b5f63">배터리 목록</text>
    <rect x="32.5" y="340" width="158" height="56" rx="15" fill="#ededed"/>
    <rect x="52" y="356" width="24" height="24" rx="8" fill="#5b5f63" opacity="0.75"/>
    <text x="88" y="373" font-size="14" font-weight="500" fill="#5b5f63">리포트 목록</text>
  </g>

  <!-- ================= 우측 사용자 블록 ================= -->
  <g>
    <rect x="1439.5" y="30" width="190" height="42" fill="#ffffff" filter="url(#sh)" rx="12"/>
    <circle cx="1462" cy="51" r="16" fill="#dfe3e7"/>
    <text x="1462" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#5b5f63">김</text>
    <text x="1487" y="56" font-size="14" fill="#191c1d">김경순</text>
    <path d="M1604 48 l5 5 l5 -5" stroke="#9ca3af" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ================= 탭바 — '분석' 활성 ================= -->
  <g>
    <rect x="243" y="17" width="385.7" height="42.9" fill="#dcdcdc" rx="12"/>
    <rect x="478.6" y="21.3" width="68.6" height="34.3" fill="#ffffff" filter="url(#sh)" rx="12"/>
    <text x="281.6" y="43.5" text-anchor="middle" font-size="17" font-weight="600" fill="#00000080">전체</text>
    <text x="358.7" y="43.5" text-anchor="middle" font-size="17" font-weight="600" fill="#00000080">대기</text>
    <text x="435.8" y="43.5" text-anchor="middle" font-size="17" font-weight="600" fill="#00000080">촬영</text>
    <text x="512.9" y="43.5" text-anchor="middle" font-size="17" font-weight="600" fill="#000000">분석</text>
    <text x="590.0" y="43.5" text-anchor="middle" font-size="17" font-weight="600" fill="#00000080">완료</text>
  </g>

  <!-- ================= 요약 바 (고정) ================= -->
  <g>
    <rect x="243" y="76" width="1160" height="80" rx="15" fill="#ffffff" filter="url(#sh)"/>

    <circle cx="273" cy="116" r="5" fill="#13777C"/>
    <text x="288" y="112" font-size="16" font-weight="600" fill="#5b5f63">분석</text>
    <text x="288" y="132" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">ANALYSIS</text>

    <line x1="382" y1="94" x2="382" y2="138" stroke="#e4e7ea" stroke-width="1"/>

    <text x="406" y="99" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">분석 중 셀</text>
    <text x="406" y="127" font-size="32" font-weight="700" fill="#191c1d" letter-spacing="-1" font-family="ui-monospace, Consolas, monospace">#1032</text>

    <line x1="580" y1="94" x2="580" y2="138" stroke="#e4e7ea" stroke-width="1"/>

    <text x="604" y="99" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">소속 배치</text>
    <text x="604" y="127" font-size="20" font-weight="700" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">#3</text>

    <text x="700" y="99" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">모델</text>
    <text x="700" y="127" font-size="20" font-weight="700" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">YOLOv11-seg</text>

    <!-- 장식: 배터리 충전 (탭당 1개) -->
    <g>
      <rect x="1010" y="98" width="130" height="44" rx="8" fill="#EBF8F9"/>
      <rect x="1066" y="106" width="18" height="4" rx="999" fill="#94a3b8"/>
      <rect x="1062" y="110" width="26" height="26" rx="4" fill="none" stroke="#13777C" stroke-width="2"/>
      <rect x="1065" y="122" width="20" height="11" rx="2" fill="#13777C"/>
      <text x="1075" y="92" text-anchor="middle" font-size="10" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">CHARGING · 분석 탭 전용 장식</text>
    </g>

    <rect x="1269" y="103" width="110" height="26" fill="#ecfdf3" stroke="#bfe3c9" stroke-width="1" rx="8"/>
    <circle cx="1284" cy="116" r="3" fill="#1e7e34"/>
    <text x="1294" y="120" font-size="11" letter-spacing="0.7" fill="#1e7e34" font-family="ui-monospace, Consolas, monospace">LIVE · 연결됨</text>
  </g>

  <!-- ================= 목록 영역 ================= -->

  <!-- 좌: 현재 분석 중 셀 상세 -->
  <g>
    <rect x="243" y="172" width="544" height="712" rx="15" fill="#ffffff" filter="url(#sh)"/>

    <text x="267" y="210" font-size="14" font-weight="600" fill="#5b5f63">현재 분석 중</text>
    <text x="352" y="209" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">IN PROGRESS</text>

    <rect x="267" y="228" width="496" height="180" rx="15" fill="#EBF8F9"/>
    <rect x="267" y="228" width="4" height="180" fill="#13777C"/>

    <text x="291" y="272" font-size="36" font-weight="700" fill="#191c1d" letter-spacing="-1.2" font-family="ui-monospace, Consolas, monospace">CELL-1032</text>
    <text x="291" y="298" font-size="12" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">Batch #3 · CAPTURED 후 분석 큐 진입</text>

    <circle cx="299" cy="332" r="8" fill="none" stroke="#D3EEEF" stroke-width="2.5"/>
    <path d="M299 324 a8 8 0 0 1 8 8" fill="none" stroke="#13777C" stroke-width="2.5" stroke-linecap="round"/>
    <text x="317" y="337" font-size="13" fill="#13777C" font-family="ui-monospace, Consolas, monospace">AI 추론 진행 중</text>

    <!-- CT / RGB 접수 상태 -->
    <rect x="291" y="356" width="220" height="34" rx="8" fill="#ffffff"/>
    <text x="307" y="378" font-size="11.5" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">CT</text>
    <circle cx="345" cy="373" r="3.5" fill="#1e7e34"/>
    <text x="356" y="378" font-size="11.5" fill="#1e7e34" font-family="ui-monospace, Consolas, monospace">결과 수신</text>

    <rect x="519" y="356" width="220" height="34" rx="8" fill="#ffffff"/>
    <text x="535" y="378" font-size="11.5" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">RGB</text>
    <circle cx="580" cy="373" r="3.5" fill="#13777C"/>
    <text x="591" y="378" font-size="11.5" fill="#13777C" font-family="ui-monospace, Consolas, monospace">대기 중</text>

    <text x="267" y="444" font-size="11.5" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">CT · RGB 두 결과가 모두 도착해야</text>
    <text x="267" y="462" font-size="11.5" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">종합 판정이 수행된다 (OR 방식, FUNC_SPEC §2.3)</text>

    <!-- Retry Count 자리 — 후속 과제 -->
    <rect x="267" y="490" width="496" height="52" rx="8" fill="#fafbfc" stroke="#e4e7ea" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="291" y="512" font-size="12" fill="#9ca3af">Retry Count 슬롯 — WS 필드 추가 후 노출</text>
    <text x="291" y="530" font-size="10.5" fill="#c3c8cd" font-family="ui-monospace, Consolas, monospace">현재는 항상 0이므로 표시하지 않는다 (§5.4, §12-2)</text>
  </g>

  <!-- 우: 분석 대기열 -->
  <g>
    <rect x="811" y="172" width="592" height="712" rx="15" fill="#ffffff" filter="url(#sh)"/>

    <text x="835" y="210" font-size="14" font-weight="600" fill="#5b5f63">분석 대기열</text>
    <text x="918" y="209" font-size="10.5" letter-spacing="0.9" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">QUEUE</text>
    <text x="1379" y="210" text-anchor="end" font-size="13" font-weight="700" fill="#5b5f63" font-family="ui-monospace, Consolas, monospace">4 cells</text>

    <text x="835" y="234" font-size="11" fill="#b4b9be" font-family="ui-monospace, Consolas, monospace">촬영 완료(CAPTURED) 후 분석을 기다리는 셀</text>

    <g>
      <rect x="835" y="250" width="544" height="46" rx="8" fill="#fafbfc"/>
      <text x="855" y="279" font-size="12" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">1</text>
      <rect x="879" y="263" width="14" height="20" rx="4" fill="#85C4C8"/>
      <text x="905" y="279" font-size="13" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1033</text>
      <text x="1359" y="279" text-anchor="end" font-size="11" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">Batch #3</text>
    </g>
    <g>
      <rect x="835" y="306" width="544" height="46" rx="8" fill="#fafbfc"/>
      <text x="855" y="335" font-size="12" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">2</text>
      <rect x="879" y="319" width="14" height="20" rx="4" fill="#85C4C8"/>
      <text x="905" y="335" font-size="13" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1034</text>
      <text x="1359" y="335" text-anchor="end" font-size="11" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">Batch #3</text>
    </g>
    <g>
      <rect x="835" y="362" width="544" height="46" rx="8" fill="#fafbfc"/>
      <text x="855" y="391" font-size="12" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">3</text>
      <rect x="879" y="375" width="14" height="20" rx="4" fill="#85C4C8"/>
      <text x="905" y="391" font-size="13" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1035</text>
      <text x="1359" y="391" text-anchor="end" font-size="11" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">Batch #3</text>
    </g>
    <g>
      <rect x="835" y="418" width="544" height="46" rx="8" fill="#fafbfc"/>
      <text x="855" y="447" font-size="12" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">4</text>
      <rect x="879" y="431" width="14" height="20" rx="4" fill="#85C4C8"/>
      <text x="905" y="447" font-size="13" fill="#191c1d" font-family="ui-monospace, Consolas, monospace">CELL-1036</text>
      <text x="1359" y="447" text-anchor="end" font-size="11" fill="#9ca3af" font-family="ui-monospace, Consolas, monospace">Batch #3</text>
    </g>

    <rect x="1387" y="250" width="6" height="140" rx="4" fill="#d0d4d8"/>
  </g>
</svg>
