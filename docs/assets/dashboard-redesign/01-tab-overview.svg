<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1646 940" width="1646" height="940" font-family="Inter, system-ui, 'Pretendard', sans-serif">
  <title>전체 탭 — Live Monitoring Flow</title>
  <desc>SVG 1단위 = 디자인 1px = 0.1rem (col-main 1200px 기준)</desc>

