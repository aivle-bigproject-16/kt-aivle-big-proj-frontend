<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 653.4 477.9" width="653" height="478" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">브랜드 로고 — 셰브론 플로우 마크</title>
  <desc>docs/assets/로고 2.png 를 벡터로 재구성한 것이다. 원본 대비 픽셀 IoU 0.925. 실선 7획과 점선 66조각이 모두 stroke 이므로 두께·라인캡·색을 값 하나로 바꿀 수 있다. 색은 brand-400 #64a0dd 에서 brand-700 #0c5795 로 가는 8단 램프이며, 짧은 조각은 stroke 속성이 단색으로, 긴 실선은 경로 방향 linearGradient 가 잡는다. CSS 클래스를 쓰지 않으므로 GitHub 를 포함해 SVG 를 새니타이즈하는 환경에서도 색이 유지된다. BRAND_COLOR §9 의 로고 리컬러 미결은 B안(brand-400 → brand-700)으로 확정했다. 재구성 시점의 옛 램프는 그레이 #7d7d7d → 레드 #d0141a 였다. 리컬러가 다시 바뀌면 아래 주석의 8단 hex 를 새 램프로 치환하는 것으로 끝난다.</desc>
  <!-- 색 램프 8단 (brand-400 → brand-700). B안 확정. 리컬러는 이 8개 hex 를 새 램프로 치환하고,
       아래 linearGradient 의 stop-color 도 같은 규칙으로 바꾸면 된다.
       0:#64a0dd  1:#5796d3  2:#4b8bc8  3:#3e81be  4:#3276b4  5:#256caa  6:#19619f  7:#0c5795 -->
  <defs>
