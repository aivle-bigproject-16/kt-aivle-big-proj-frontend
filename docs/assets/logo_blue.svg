    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="405.4" y1="129.2" x2="301.4" y2="312.2"><stop offset="0" stop-color="#5796d3"/><stop offset="1" stop-color="#3e81be"/></linearGradient>
