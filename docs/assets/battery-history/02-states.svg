<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1240" width="1920" height="1240" font-family="Inter, system-ui, sans-serif">
  <title>배터리 목록 — 상태 변형</title>
  <desc>로딩 스켈레톤 · 데이터 0건 · 필터 결과 0건 · 조회 실패. 헤더와 툴바는 어느 상태에서도 덮지 않는다.</desc>

  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1920" height="1240" fill="#ededed"/>

  <text x="60" y="52" font-size="24" font-weight="700" fill="#191c1d">배터리 목록 — 상태 변형</text>
  <text x="60" y="78" font-size="13" fill="#5b5f63">헤더와 툴바는 어느 상태에서도 덮지 않는다. 필터 조작은 로딩 중에도 가능해야 한다. 테이블 카드 영역만 발췌했다.</text>
  <line x1="60" y1="96" x2="1860" y2="96" stroke="#e1e5ea" stroke-width="1"/>

  <!-- ============ A. 로딩 스켈레톤 ============ -->
  <text x="60" y="136" font-size="11" letter-spacing="1.1" fill="#0c5795">A</text>
  <text x="84" y="136" font-size="17" font-weight="650" fill="#191c1d">조회 중 — 스켈레톤 8행</text>
  <text x="60" y="158" font-size="12.5" fill="#5b5f63">최종 레이아웃과 같은 높이라 로딩이 끝나도 시프트가 없다. 바 폭은 컬럼별로 달리해 기계적으로 보이지 않게 한다.</text>

  <g transform="translate(60,176)">
    <rect x="0" y="0" width="860" height="500" rx="15" fill="#ffffff" filter="url(#sh)"/>

    <text x="24" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 시리얼</text>
    <text x="272" y="46" font-size="13" font-weight="600" fill="#5b5f63">모델</text>
    <text x="424" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 유형</text>
    <text x="524" y="46" font-size="13" font-weight="600" fill="#5b5f63">최근 검사</text>
    <text x="690" y="46" font-size="13" font-weight="600" fill="#5b5f63">판정</text>
    <line x1="12" y1="62" x2="848" y2="62" stroke="#eceef0" stroke-width="1"/>

    <g fill="#eceef0">
      <rect x="24" y="84"  width="188" height="14" rx="4"/><rect x="272" y="84"  width="122" height="14" rx="4"/><rect x="424" y="84"  width="72" height="24" rx="12"/><rect x="524" y="84"  width="148" height="14" rx="4"/><rect x="690" y="84"  width="86" height="24" rx="12"/>
      <rect x="24" y="140" width="164" height="14" rx="4"/><rect x="272" y="140" width="134" height="14" rx="4"/><rect x="424" y="140" width="72" height="24" rx="12"/><rect x="524" y="140" width="148" height="14" rx="4"/><rect x="690" y="140" width="70" height="24" rx="12"/>
      <rect x="24" y="196" width="198" height="14" rx="4"/><rect x="272" y="196" width="110" height="14" rx="4"/><rect x="424" y="196" width="72" height="24" rx="12"/><rect x="524" y="196" width="148" height="14" rx="4"/><rect x="690" y="196" width="86" height="24" rx="12"/>
      <rect x="24" y="252" width="172" height="14" rx="4"/><rect x="272" y="252" width="128" height="14" rx="4"/><rect x="424" y="252" width="72" height="24" rx="12"/><rect x="524" y="252" width="148" height="14" rx="4"/><rect x="690" y="252" width="70" height="24" rx="12"/>
      <rect x="24" y="308" width="190" height="14" rx="4"/><rect x="272" y="308" width="118" height="14" rx="4"/><rect x="424" y="308" width="72" height="24" rx="12"/><rect x="524" y="308" width="148" height="14" rx="4"/><rect x="690" y="308" width="70" height="24" rx="12"/>
      <rect x="24" y="364" width="156" height="14" rx="4"/><rect x="272" y="364" width="140" height="14" rx="4"/><rect x="424" y="364" width="72" height="24" rx="12"/><rect x="524" y="364" width="148" height="14" rx="4"/><rect x="690" y="364" width="86" height="24" rx="12"/>
      <rect x="24" y="420" width="182" height="14" rx="4"/><rect x="272" y="420" width="112" height="14" rx="4"/><rect x="424" y="420" width="72" height="24" rx="12"/><rect x="524" y="420" width="148" height="14" rx="4"/><rect x="690" y="420" width="70" height="24" rx="12"/>
      <rect x="24" y="464" width="168" height="14" rx="4"/><rect x="272" y="464" width="126" height="14" rx="4"/><rect x="424" y="464" width="72" height="24" rx="12"/><rect x="524" y="464" width="148" height="14" rx="4"/><rect x="690" y="464" width="70" height="24" rx="12"/>
    </g>
  </g>

  <!-- ============ B. 데이터 0건 ============ -->
  <text x="1000" y="136" font-size="11" letter-spacing="1.1" fill="#0c5795">B</text>
  <text x="1024" y="136" font-size="17" font-weight="650" fill="#191c1d">데이터 자체가 0건</text>
  <text x="1000" y="158" font-size="12.5" fill="#5b5f63">해결책이 "기다리기"다. 배터리 목록에는 생성 CTA를 두지 않는다 — 검사는 시뮬레이션이 만든다.</text>

  <g transform="translate(1000,176)">
    <rect x="0" y="0" width="860" height="500" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="24" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 시리얼</text>
    <text x="272" y="46" font-size="13" font-weight="600" fill="#5b5f63">모델</text>
    <text x="424" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 유형</text>
    <text x="524" y="46" font-size="13" font-weight="600" fill="#5b5f63">최근 검사</text>
    <text x="690" y="46" font-size="13" font-weight="600" fill="#5b5f63">판정</text>
    <line x1="12" y1="62" x2="848" y2="62" stroke="#eceef0" stroke-width="1"/>

    <g transform="translate(430,278)">
      <rect x="-30" y="-96" width="60" height="60" rx="12" fill="#f3f4f6"/>
      <rect x="-14" y="-82" width="28" height="32" rx="4" fill="none" stroke="#c3c8cd" stroke-width="2"/>
      <rect x="-7" y="-86" width="14" height="4" rx="2" fill="#c3c8cd"/>
      <text x="0" y="-6" text-anchor="middle" font-size="16" font-weight="600" fill="#191c1d">아직 검사된 배터리가 없습니다</text>
      <text x="0" y="20" text-anchor="middle" font-size="13" fill="#5b5f63">대시보드에서 시뮬레이션을 실행하면 검사 결과가 이곳에 쌓입니다</text>
    </g>
  </g>

  <!-- ============ C. 필터 결과 0건 ============ -->
  <text x="60" y="746" font-size="11" letter-spacing="1.1" fill="#0c5795">C</text>
  <text x="84" y="746" font-size="17" font-weight="650" fill="#191c1d">필터·검색 결과가 0건</text>
  <text x="60" y="768" font-size="12.5" fill="#5b5f63">해결책이 "필터 풀기"라 B와 정반대다. 같은 문구를 쓰면 필터를 켜둔 것을 모르고 "데이터가 없다"로 오해한다.</text>

  <g transform="translate(60,786)">
    <!-- 툴바를 함께 그려 필터가 켜져 있음을 보인다 -->
    <rect x="0" y="0" width="86" height="32" rx="16" fill="#ffffff"/>
    <text x="29" y="20" text-anchor="middle" font-size="13" font-weight="500" fill="#5b5f63">전체</text>
    <text x="68" y="20" text-anchor="middle" font-size="12" fill="#9ca3af">47</text>
    <rect x="90" y="0" width="94" height="32" rx="16" fill="#0c5795"/>
    <path d="M111 12 l5 8 h-10 z" fill="#ffffff"/>
    <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">FAIL</text>
    <text x="170" y="20" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.75">0</text>

    <rect x="620" y="0" width="240" height="32" rx="16" fill="#ffffff"/>
    <circle cx="641" cy="16" r="5.5" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
    <path d="M645 20 l4 4" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
    <text x="657" y="21" font-size="13" fill="#191c1d">CELL-99</text>
    <circle cx="840" cy="16" r="8" fill="#eceef0"/>
    <path d="M837 13 l6 6 M843 13 l-6 6" stroke="#5b5f63" stroke-width="1.4" stroke-linecap="round"/>

    <rect x="0" y="48" width="860" height="380" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="24" y="94" font-size="13" font-weight="600" fill="#5b5f63">셀 시리얼</text>
    <text x="272" y="94" font-size="13" font-weight="600" fill="#5b5f63">모델</text>
    <text x="424" y="94" font-size="13" font-weight="600" fill="#5b5f63">셀 유형</text>
    <text x="524" y="94" font-size="13" font-weight="600" fill="#5b5f63">최근 검사</text>
    <text x="690" y="94" font-size="13" font-weight="600" fill="#5b5f63">판정</text>
    <line x1="12" y1="110" x2="848" y2="110" stroke="#eceef0" stroke-width="1"/>

    <g transform="translate(430,272)">
      <circle cx="0" cy="-84" r="26" fill="#f3f4f6"/>
      <circle cx="-4" cy="-88" r="9" fill="none" stroke="#c3c8cd" stroke-width="2"/>
      <path d="M3 -81 l8 8" stroke="#c3c8cd" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="-14" text-anchor="middle" font-size="16" font-weight="600" fill="#191c1d">조건에 맞는 항목이 없습니다</text>
      <text x="0" y="12" text-anchor="middle" font-size="13" fill="#5b5f63">필터 또는 검색어를 조정해 보세요</text>
      <rect x="-56" y="34" width="112" height="36" rx="8" fill="#ffffff" stroke="#0c5795" stroke-width="1.2"/>
      <text x="0" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#0c5795">필터 초기화</text>
    </g>
  </g>

  <!-- ============ D. 조회 실패 ============ -->
  <text x="1000" y="746" font-size="11" letter-spacing="1.1" fill="#0c5795">D</text>
  <text x="1024" y="746" font-size="17" font-weight="650" fill="#191c1d">조회 실패</text>
  <text x="1000" y="768" font-size="12.5" fill="#5b5f63">FUNC_SPEC §1.4 가 자동 재시도를 금지했으므로, 수동 재시도 수단이 없으면 새로고침 외에 방법이 없다.</text>

  <g transform="translate(1000,834)">
    <rect x="0" y="0" width="860" height="380" rx="15" fill="#ffffff" filter="url(#sh)"/>
    <text x="24" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 시리얼</text>
    <text x="272" y="46" font-size="13" font-weight="600" fill="#5b5f63">모델</text>
    <text x="424" y="46" font-size="13" font-weight="600" fill="#5b5f63">셀 유형</text>
    <text x="524" y="46" font-size="13" font-weight="600" fill="#5b5f63">최근 검사</text>
    <text x="690" y="46" font-size="13" font-weight="600" fill="#5b5f63">판정</text>
    <line x1="12" y1="62" x2="848" y2="62" stroke="#eceef0" stroke-width="1"/>

    <g transform="translate(430,224)">
      <circle cx="0" cy="-84" r="26" fill="#fef2f2"/>
      <path d="M0 -96 l10 17 h-20 z" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 -90 v5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-82" r="1.2" fill="#dc2626"/>
      <text x="0" y="-14" text-anchor="middle" font-size="16" font-weight="600" fill="#191c1d">목록을 불러오지 못했습니다</text>
      <text x="0" y="12" text-anchor="middle" font-size="13" fill="#5b5f63">배터리 목록 조회에 실패했습니다.</text>
      <rect x="-52" y="34" width="104" height="36" rx="8" fill="#0c5795"/>
      <text x="0" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">다시 시도</text>
    </g>
  </g>

  <!-- 푸터 규칙 -->
  <g transform="translate(60,1236)">
    <text x="0" y="-8" font-size="11.5" fill="#b4b9be">푸터 규칙 — 결과 0건이면 페이지네이션 컨트롤을 숨기고 건수는 "0건"으로만 표기한다. 현행 Pagination 은 totalPages = max(1, ...) 이라 0건에도 1 버튼이 뜬다.</text>
  </g>
</svg>
